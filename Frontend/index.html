<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atmos Twin — Environmental Intelligence System</title>
  <meta name="description" content="City-level environmental digital twin — real-time AQI forecasting, source attribution, scenario simulation, and decision support for urban environments." />
  <meta name="theme-color" content="#12151B" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>

  <!-- ── Storm intro (injected by loader) ── -->
  <div id="slot-storm"></div>

  <!-- ── App Shell ── -->
  <div class="app-frame" id="app-frame">

    <!-- Left Nav Rail -->
    <aside class="nav-rail">
      <div class="nav-rail__top">
        <div class="nav-rail__brand">
          <div class="nav-rail__logo-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M12 2V22M2 12H22M4.93 4.93L19.07 19.07M4.93 19.07L19.07 4.93" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="nav-rail__brand-text">Atmos</span>
        </div>

        <nav class="nav-rail__menu">
          <button class="rail-btn rail-btn--active" title="Dashboard" data-view="dashboard">
            <i data-lucide="layout-grid"></i>
          </button>
          <button class="rail-btn" title="Map View" data-view="map">
            <i data-lucide="map"></i>
          </button>
          <button class="rail-btn" title="Scenario Simulation" data-view="scenario">
            <i data-lucide="sliders-horizontal"></i>
          </button>
          <button class="rail-btn" title="Analytics & Wards" data-view="wards">
            <i data-lucide="pie-chart"></i>
          </button>
          <button class="rail-btn" title="Accuracy Tracker" data-view="accuracy">
            <i data-lucide="calendar"></i>
          </button>
          <button class="rail-btn" title="Settings" data-view="settings">
            <i data-lucide="settings"></i>
          </button>
        </nav>
      </div>

      <div class="nav-rail__bottom">
        <button class="rail-btn" id="btn-replay-storm" title="Replay Thunder & Clouds Intro">
          <i data-lucide="zap"></i>
        </button>
        <button class="rail-btn rail-btn--alert" id="drift-alert-trigger" title="Twin Drift: 1 Active Divergence">
          <i data-lucide="bell"></i>
          <span class="alert-badge-dot"></span>
        </button>
        <div class="nav-rail__avatar" title="City Admin: Maharashtra Twin">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Admin Avatar" />
        </div>
      </div>
    </aside>

    <!-- Views wrapper — each view is injected into its slot -->
    <div class="views-wrapper" id="views-wrapper">
      <div id="slot-dashboard"></div>
      <div id="slot-map"></div>
      <div id="slot-scenario"></div>
      <div id="slot-wards"></div>
      <div id="slot-accuracy"></div>
      <div id="slot-settings"></div>
    </div>

  </div><!-- /app-frame -->

  <!-- Global modals (Drift, Search, Briefing) -->
  <div id="slot-modals"></div>

  <!-- Floating AI Advisor widget -->
  <div id="slot-ai-advisor"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
