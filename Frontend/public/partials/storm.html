<div class="storm-intro" id="storm-intro">
  <!-- WebGL Canvas for Realistic Lightning Shader -->
  <canvas id="lightning-canvas" class="lightning-canvas"></canvas>
  <!-- Canvas for Volumetric Rolling Storm Clouds -->
  <canvas id="clouds-canvas" class="clouds-canvas"></canvas>

  <!-- Prominent Volumetric Storm Cloud Banks -->
  <div class="clouds-overlay" id="clouds-overlay">
    <!-- Left Thunderhead Cloud Bank -->
    <div class="clouds-bank clouds-bank--left" id="clouds-left">
      <svg class="cloud-svg cloud-svg--back" viewBox="0 0 1000 800" preserveAspectRatio="none">
        <defs>
          <linearGradient id="grad-cloud-back-left" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="40%" stop-color="#F1F5F9" />
            <stop offset="70%" stop-color="#CBD5E1" />
            <stop offset="88%" stop-color="#94A3B8" />
            <stop offset="100%" stop-color="#475569" />
          </linearGradient>
        </defs>
        <path d="M-100,800 L-100,-100 Q150,-80 250,50 Q350,10 480,120 Q580,80 680,220 Q750,300 700,420 Q780,520 650,650 Q550,750 400,800 Z" fill="url(#grad-cloud-back-left)" />
      </svg>
      <svg class="cloud-svg cloud-svg--front" viewBox="0 0 1000 800" preserveAspectRatio="none">
        <defs>
          <linearGradient id="grad-cloud-front-left" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="35%" stop-color="#FFFFFF" />
            <stop offset="65%" stop-color="#E2E8F0" />
            <stop offset="85%" stop-color="#94A3B8" />
            <stop offset="100%" stop-color="#64748B" />
          </linearGradient>
        </defs>
        <path d="M-100,800 L-100,50 Q100,30 200,160 Q280,120 400,240 Q480,200 560,340 Q620,440 540,560 Q600,680 450,780 Q300,800 -100,800 Z" fill="url(#grad-cloud-front-left)" />
      </svg>
      <div class="cloud-puff cloud-puff--1"></div>
      <div class="cloud-puff cloud-puff--2"></div>
      <div class="cloud-puff cloud-puff--3"></div>
      <div class="cloud-puff cloud-puff--4"></div>
      <div class="cloud-puff cloud-puff--5"></div>
      <div class="cloud-rim cloud-rim--left"></div>
    </div>

    <!-- Right Thunderhead Cloud Bank -->
    <div class="clouds-bank clouds-bank--right" id="clouds-right">
      <svg class="cloud-svg cloud-svg--back" viewBox="0 0 1000 800" preserveAspectRatio="none">
        <defs>
          <linearGradient id="grad-cloud-back-right" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="40%" stop-color="#F1F5F9" />
            <stop offset="70%" stop-color="#CBD5E1" />
            <stop offset="88%" stop-color="#94A3B8" />
            <stop offset="100%" stop-color="#475569" />
          </linearGradient>
        </defs>
        <path d="M1100,800 L1100,-100 Q850,-80 750,50 Q650,10 520,120 Q420,80 320,220 Q250,300 300,420 Q220,520 350,650 Q450,750 600,800 Z" fill="url(#grad-cloud-back-right)" />
      </svg>
      <svg class="cloud-svg cloud-svg--front" viewBox="0 0 1000 800" preserveAspectRatio="none">
        <defs>
          <linearGradient id="grad-cloud-front-right" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="35%" stop-color="#FFFFFF" />
            <stop offset="65%" stop-color="#E2E8F0" />
            <stop offset="85%" stop-color="#94A3B8" />
            <stop offset="100%" stop-color="#64748B" />
          </linearGradient>
        </defs>
        <path d="M1100,800 L1100,50 Q900,30 800,160 Q720,120 600,240 Q520,200 440,340 Q380,440 460,560 Q400,680 550,780 Q700,800 1100,800 Z" fill="url(#grad-cloud-front-right)" />
      </svg>
      <div class="cloud-puff cloud-puff--6"></div>
      <div class="cloud-puff cloud-puff--7"></div>
      <div class="cloud-puff cloud-puff--8"></div>
      <div class="cloud-puff cloud-puff--9"></div>
      <div class="cloud-puff cloud-puff--10"></div>
      <div class="cloud-rim cloud-rim--right"></div>
    </div>

    <div class="clouds-shelf" id="clouds-shelf"></div>
    <div class="clouds-center" id="clouds-center"></div>
    <div class="clouds-mist" id="clouds-mist"></div>
  </div>

  <div class="storm-flash" id="storm-flash"></div>

  <div class="storm-title-group" id="storm-title">
    <div class="storm-brand-logo">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
        <path d="M12 2V22M2 12H22M4.93 4.93L19.07 19.07M4.93 19.07L19.07 4.93" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="storm-title-text">ATMOS TWIN</h1>
    <p class="storm-subtitle">Environmental Intelligence Digital Twin</p>
    <div class="storm-loading-bar">
      <div class="storm-loading-fill" id="storm-loading-fill"></div>
    </div>
    <button class="storm-skip-btn" id="storm-skip">Skip Intro ➔</button>
  </div>
</div>
