version: "3.9"

services:

  # ── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: atmos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────
  api:
    build: .
    container_name: atmos-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override Redis URL to use the service name (not localhost)
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Mount data folder so CSVs are accessible without rebuilding
      - ./data:/app/data
    restart: unless-stopped

  # ── Stream Producer (run once to seed the stream) ────────
  producer:
    build: .
    container_name: atmos-producer
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    # Replay Delhi data at 10× speed — change city/speed as needed
    command: python -m ingestion.producer --city Delhi --speed 10.0
    profiles:
      - ingestion   # only runs with: docker compose --profile ingestion up

  # ── Stream Consumer (runs continuously) ──────────────────
  consumer:
    build: .
    container_name: atmos-consumer
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    command: python -m ingestion.consumer
    profiles:
      - ingestion   # only runs with: docker compose --profile ingestion up
    restart: unless-stopped

volumes:
  redis_data:
